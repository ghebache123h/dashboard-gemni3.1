
services:
  db:
    image: postgres:15-alpine
    container_name: analytics-db
    environment:
      POSTGRES_USER: dokploy
      POSTGRES_PASSWORD: secure_dokploy_pass_123
      POSTGRES_DB: analytics
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dokploy -d analytics"]
      interval: 5s
      timeout: 5s
      retries: 5

  dashboard:
    build: .
    container_name: analytics-dashboard
    expose:
      - "3000"
    environment:
      # This exactly matches the PostgreSQL credentials above 
      DATABASE_URL: "postgresql://dokploy:secure_dokploy_pass_123@db:5432/analytics?schema=public"
    depends_on:
      db:
        condition: service_healthy
    restart: always

volumes:
  pgdata:
